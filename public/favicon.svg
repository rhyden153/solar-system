<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="space" cx="50%" cy="42%" r="72%">
      <stop offset="0" stop-color="#15232b"/>
      <stop offset="1" stop-color="#080c10"/>
    </radialGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#e9b640" stop-opacity=".5"/>
      <stop offset=".55" stop-color="#e9b640" stop-opacity=".12"/>
      <stop offset="1" stop-color="#e9b640" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sun" cx="40%" cy="36%" r="70%">
      <stop offset="0" stop-color="#fff0c4"/>
      <stop offset=".45" stop-color="#f0c04e"/>
      <stop offset="1" stop-color="#c98a2c"/>
    </radialGradient>
    <radialGradient id="moon" cx="38%" cy="34%" r="70%">
      <stop offset="0" stop-color="#f4fbf6"/>
      <stop offset="1" stop-color="#9fbdb3"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#space)"/>

  <g fill="#cde0d6">
    <circle cx="96" cy="118" r="5" opacity=".55"/>
    <circle cx="410" cy="400" r="4" opacity=".45"/>
    <circle cx="420" cy="96" r="3" opacity=".4"/>
    <circle cx="118" cy="416" r="3" opacity=".35"/>
  </g>

  <circle cx="256" cy="256" r="132" fill="url(#glow)"/>

  <g transform="rotate(-28 256 256)" fill="none" stroke-width="16">
    <circle cx="256" cy="256" r="148" stroke="#c8a24d"/>
    <ellipse cx="256" cy="256" rx="214" ry="66" stroke="#648d91"/>
  </g>

  <circle cx="256" cy="256" r="54" fill="url(#sun)"/>

  <!-- Moon at the upper right of the outer orbit, matching the sidebar brand mark. -->
  <circle cx="404" cy="256" r="30" fill="url(#moon)" stroke="#0d1318" stroke-width="10" transform="rotate(-56 256 256)"/>
  <circle cx="470" cy="256" r="17" fill="#8fc3bd" stroke="#0d1318" stroke-width="8" transform="rotate(152 256 256)"/>
</svg>
